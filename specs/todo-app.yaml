version: "2.0"
title: シンプルなTodo管理アプリ
notes: 日々のタスクを登録し、一覧から編集・完了・削除できる基本的なTodo管理を想定する。
domain:
  notes: 初期版ではタスクを単一ユーザーが管理し、認証や共有は対象外とする。
  entities:
    - id: task
      title: タスク
      description: ユーザーが管理する作業項目
      fields:
        - { id: id, title: 識別子, type: string, required: true }
        - { id: title, title: 件名, type: string, required: true }
        - { id: description, title: 詳細, type: string }
        - { id: is-completed, title: 完了状態, type: boolean, required: true }
        - { id: due-date, title: 期限, type: date }
        - { id: created-at, title: 作成日時, type: datetime, required: true }
        - { id: updated-at, title: 更新日時, type: datetime, required: true }
    - id: task-filter
      title: タスク絞り込み条件
      description: 一覧に表示するタスクの状態を指定する条件
      fields:
        - { id: status, title: 状態, type: "enum: すべて / 未完了 / 完了", required: true }
  terms:
    - id: incomplete-task
      title: 未完了タスク
      definition: 完了状態がfalseのタスク
      entity: task
    - id: completed-task
      title: 完了タスク
      definition: 完了状態がtrueのタスク
      entity: task
    - id: task-list
      title: タスク一覧
      definition: 登録済みタスクを絞り込み条件に従って表示する一覧
      entity: task
flows:
  - id: task-management
    title: タスクを管理する
    actor: ユーザー
    goal: タスクを登録して日々の作業を整理する
    notes: 一覧を起点に、登録・編集・完了・削除の各操作を行う。
    steps:
      - { id: view-list, title: タスク一覧を表示する, useCase: browse-tasks }
      - { id: add-task, title: 新しいタスクを登録する, useCase: create-task }
      - { id: edit-task, title: 登録済みタスクを編集する, useCase: edit-task }
      - { id: complete-task, title: タスクを完了にする, useCase: complete-task }
      - { id: delete-task, title: 不要なタスクを削除する, useCase: delete-task }
useCases:
  - id: browse-tasks
    title: タスク一覧を確認する
    actor: ユーザー
    entities: [task, task-filter]
    screens: [dashboard]
    preconditions: [アプリを開いている]
    postconditions: [指定した状態のタスクが一覧に表示されている]
    notes: 初期表示では未完了タスクを先に確認できるようにする。
    steps:
      - id: open
        title: タスク一覧を開く
        screen: dashboard
        action: { screen: dashboard, component: refresh-tasks }
      - { id: view, title: タスクの件名と状態を確認する, screen: dashboard }
      - id: filter
        title: 表示する状態を絞り込む
        screen: dashboard
        action: { screen: dashboard, component: status-filter }
      - { id: confirm, title: 絞り込み結果を確認する, screen: dashboard }
    branches:
      - id: show-all-tasks
        kind: alternate
        from: filter
        condition: 表示条件で「すべて」が選択された
        outcome: 未完了と完了の両方を一覧に表示する
        resumeAt: confirm
        screen: dashboard
      - id: list-load-error
        kind: exception
        from: open
        condition: タスク一覧の読み込みに失敗した
        outcome: エラー表示と再読み込み操作を表示する
        resumeAt: open
        screen: dashboard
  - id: create-task
    title: タスクを登録する
    actor: ユーザー
    entities: [task]
    screens: [dashboard, task-create]
    preconditions: [タスク一覧を表示できる]
    postconditions: [新しいタスクが未完了として一覧に表示される]
    notes: 件名だけを必須入力とし、詳細と期限は任意とする。
    steps:
      - id: open
        title: タスク登録画面を開く
        screen: dashboard
        action: { screen: dashboard, component: new-task }
      - { id: input, title: 件名・詳細・期限を入力する, screen: task-create }
      - id: save
        title: タスクを保存する
        screen: task-create
        action: { screen: task-create, component: save-task }
      - { id: confirm, title: 一覧で登録結果を確認する, screen: dashboard }
    branches:
      - id: missing-title
        kind: alternate
        from: save
        condition: 件名が未入力である
        outcome: 件名入力欄にエラーを表示し、入力画面に留まる
        resumeAt: input
        screen: task-create
      - id: create-network-error
        kind: exception
        from: save
        condition: 保存中に通信が失敗した
        outcome: 入力内容を保持して再試行を案内する
        resumeAt: save
        screen: task-create
  - id: edit-task
    title: タスクを編集する
    actor: ユーザー
    entities: [task]
    screens: [dashboard, task-edit]
    preconditions: [編集対象のタスクが一覧に存在する]
    postconditions: [編集内容が対象タスクに反映されて一覧に表示される]
    notes: 完了済みタスクも件名や詳細を編集できる。
    steps:
      - id: select
        title: 編集対象のタスクを選ぶ
        screen: dashboard
        action: { screen: dashboard, component: edit-task }
      - { id: input, title: タスクの内容を変更する, screen: task-edit }
      - id: save
        title: 編集内容を保存する
        screen: task-edit
        action: { screen: task-edit, component: update-task }
      - { id: confirm, title: 一覧で更新結果を確認する, screen: dashboard }
    branches:
      - id: completed-edit-warning
        kind: alternate
        from: select
        condition: 完了済みタスクを編集しようとした
        outcome: 完了済みであることを表示した上で編集画面を開く
        resumeAt: input
        screen: task-edit
      - id: edit-network-error
        kind: exception
        from: save
        condition: 更新中に通信が失敗した
        outcome: 変更内容を保持して再試行を案内する
        resumeAt: save
        screen: task-edit
  - id: complete-task
    title: タスクを完了にする
    actor: ユーザー
    entities: [task]
    screens: [dashboard]
    preconditions: [未完了のタスクが一覧に存在する]
    postconditions: [対象タスクが完了として表示される]
    notes: 完了操作は一覧上のタスクごとのボタンから行う。
    steps:
      - id: select
        title: 完了するタスクを選ぶ
        screen: dashboard
        action: { screen: dashboard, component: complete-task }
      - id: complete
        title: タスクを完了として保存する
        screen: dashboard
        action: { screen: dashboard, component: complete-task }
      - { id: confirm, title: 完了表示を確認する, screen: dashboard }
    branches:
      - id: already-completed
        kind: alternate
        from: complete
        condition: 対象タスクがすでに完了している
        outcome: 状態を変更せず完了済みとして表示する
        resumeAt: confirm
        screen: dashboard
      - id: complete-network-error
        kind: exception
        from: complete
        condition: 完了状態の保存に失敗した
        outcome: 未完了表示を維持して再試行を案内する
        resumeAt: complete
        screen: dashboard
  - id: delete-task
    title: タスクを削除する
    actor: ユーザー
    entities: [task]
    screens: [dashboard, delete-confirm]
    preconditions: [削除対象のタスクが一覧に存在する]
    postconditions: [対象タスクが一覧から削除される]
    notes: 誤操作を防ぐため、削除前に確認画面を表示する。
    steps:
      - id: select
        title: 削除対象のタスクを選ぶ
        screen: dashboard
        action: { screen: dashboard, component: delete-task }
      - { id: review, title: 削除確認画面で内容を確認する, screen: delete-confirm }
      - id: delete
        title: タスクの削除を確定する
        screen: delete-confirm
        action: { screen: delete-confirm, component: confirm-delete }
      - { id: confirm, title: 一覧から削除されたことを確認する, screen: dashboard }
    branches:
      - id: cancel-delete
        kind: alternate
        from: review
        condition: ユーザーが削除をキャンセルした
        outcome: タスクを残したまま一覧へ戻る
        screen: dashboard
      - id: delete-network-error
        kind: exception
        from: delete
        condition: 削除処理中に通信が失敗した
        outcome: タスクを残して再試行を案内する
        resumeAt: delete
        screen: delete-confirm
screens:
  - id: dashboard
    title: タスク一覧
    description: 登録済みタスクを確認し、各タスクの操作を行うホーム画面。
    entities: [task, task-filter]
    useCases: [browse-tasks, create-task, edit-task, complete-task, delete-task]
    notes: 空の一覧では登録を促し、読み込み失敗時は再読み込みを可能にする。
    stateFlow:
      initial: loading
      notes: 一覧の読み込み中と読み込み失敗を明示する。
      states:
        - { id: loading, title: 読み込み中 }
        - { id: browsing, title: 一覧を閲覧中 }
        - { id: empty, title: タスクなし }
        - { id: error, title: 読み込み失敗 }
      transitions:
        - { from: loading, to: browsing, trigger: 読み込み成功 }
        - { from: loading, to: empty, trigger: タスクが0件 }
        - { from: loading, to: error, trigger: 読み込み失敗 }
        - { from: error, to: loading, trigger: 再読み込み, component: refresh-tasks }
        - { from: empty, to: loading, trigger: 再読み込み, component: refresh-tasks }
    components:
      - { type: text, id: heading, content: 今日のタスク }
      - type: button
        id: refresh-tasks
        label: 再読み込み
        action: refresh-tasks
        useCases: [browse-tasks]
        outcome: 最新のタスク一覧を取得する
      - type: button
        id: new-task
        label: タスクを追加
        action: open-create-task
        useCases: [create-task]
        outcome: タスク登録画面を開く
      - type: select
        id: status-filter
        label: 表示状態
        action: filter-tasks
        options: [すべて, 未完了, 完了]
        useCases: [browse-tasks]
        outcome: 選択した状態のタスクだけを表示する
      - type: list
        id: task-list
        label: タスク一覧
        useCases: [browse-tasks, edit-task, complete-task, delete-task]
      - { type: text, id: empty-message, content: タスクがありません。新しいタスクを追加してください。 }
      - type: button
        id: edit-task
        label: 編集
        action: open-edit-task
        useCases: [edit-task]
        precondition: 編集対象のタスクが選択されている
        outcome: タスク編集画面を開く
      - type: button
        id: complete-task
        label: 完了にする
        action: complete-task
        useCases: [complete-task]
        precondition: 未完了のタスクが選択されている
        outcome: タスクを完了として保存する
      - type: button
        id: delete-task
        label: 削除
        action: open-delete-confirm
        useCases: [delete-task]
        precondition: 削除対象のタスクが選択されている
        outcome: 削除確認画面を開く
  - id: task-create
    title: タスク登録
    description: 新しいタスクの件名、詳細、期限を入力する画面。
    entities: [task]
    useCases: [create-task]
    notes: 保存に失敗した場合も入力値を保持する。
    stateFlow:
      initial: editing
      notes: 保存中は二重送信を防ぎ、失敗時は同じ入力から再試行できる。
      states:
        - { id: editing, title: 入力中 }
        - { id: saving, title: 保存中 }
        - { id: error, title: 保存失敗 }
        - { id: saved, title: 保存完了 }
      transitions:
        - { from: editing, to: saving, trigger: 保存, component: save-task }
        - { from: saving, to: error, trigger: 保存失敗 }
        - { from: error, to: saving, trigger: 再試行, component: save-task }
        - { from: saving, to: saved, trigger: 保存成功 }
    components:
      - { type: input, id: task-title, label: 件名, placeholder: 例：買い物に行く, required: true }
      - { type: input, id: task-description, label: 詳細, placeholder: タスクの詳細を入力 }
      - { type: input, id: task-due-date, label: 期限, placeholder: YYYY-MM-DD }
      - type: button
        id: save-task
        label: 保存する
        action: save-task
        useCases: [create-task]
        precondition: 件名が入力され、保存中ではない
        outcome: タスクを登録して一覧へ戻る
      - type: link
        id: cancel-create
        label: キャンセル
        action: cancel-create
        useCases: [create-task]
        outcome: 入力を破棄して一覧へ戻る
  - id: task-edit
    title: タスク編集
    description: 選択したタスクの内容を変更する画面。
    entities: [task]
    useCases: [edit-task]
    notes: 保存前にキャンセルした場合は変更を破棄する。
    stateFlow:
      initial: editing
      notes: 更新失敗時は入力中の変更を保持する。
      states:
        - { id: editing, title: 編集中 }
        - { id: saving, title: 更新中 }
        - { id: error, title: 更新失敗 }
        - { id: saved, title: 更新完了 }
      transitions:
        - { from: editing, to: saving, trigger: 更新, component: update-task }
        - { from: saving, to: error, trigger: 更新失敗 }
        - { from: error, to: saving, trigger: 再試行, component: update-task }
        - { from: saving, to: saved, trigger: 更新成功 }
    components:
      - { type: input, id: edit-task-title, label: 件名, placeholder: タスクの件名, required: true }
      - { type: input, id: edit-task-description, label: 詳細, placeholder: タスクの詳細 }
      - { type: input, id: edit-task-due-date, label: 期限, placeholder: YYYY-MM-DD }
      - type: button
        id: update-task
        label: 変更を保存
        action: update-task
        useCases: [edit-task]
        precondition: 件名が入力され、更新中ではない
        outcome: タスクを更新して一覧へ戻る
      - type: link
        id: cancel-edit
        label: キャンセル
        action: cancel-edit
        useCases: [edit-task]
        outcome: 変更を破棄して一覧へ戻る
  - id: delete-confirm
    title: タスク削除の確認
    description: 選択したタスクを削除してよいか確認する画面。
    entities: [task]
    useCases: [delete-task]
    notes: 確認操作を必須にし、誤削除を防ぐ。
    stateFlow:
      initial: confirming
      notes: 削除失敗時は確認画面に留まり再試行できる。
      states:
        - { id: confirming, title: 削除確認中 }
        - { id: deleting, title: 削除中 }
        - { id: error, title: 削除失敗 }
        - { id: deleted, title: 削除完了 }
      transitions:
        - { from: confirming, to: deleting, trigger: 削除確定, component: confirm-delete }
        - { from: deleting, to: error, trigger: 削除失敗 }
        - { from: error, to: deleting, trigger: 再試行, component: confirm-delete }
        - { from: deleting, to: deleted, trigger: 削除成功 }
    components:
      - { type: card, id: target-task, label: 削除対象のタスク }
      - type: button
        id: confirm-delete
        label: 削除する
        action: confirm-delete
        useCases: [delete-task]
        precondition: 削除対象を確認している
        outcome: タスクを削除して一覧へ戻る
      - type: link
        id: cancel-delete
        label: キャンセル
        action: cancel-delete
        useCases: [delete-task]
        outcome: 削除せず一覧へ戻る
transitions:
  - { from: dashboard, to: task-create, trigger: open-create-task.click }
  - { from: task-create, to: dashboard, trigger: save-task.submit }
  - { from: task-create, to: dashboard, trigger: cancel-create.click }
  - { from: dashboard, to: task-edit, trigger: open-edit-task.click }
  - { from: task-edit, to: dashboard, trigger: update-task.submit }
  - { from: task-edit, to: dashboard, trigger: cancel-edit.click }
  - { from: dashboard, to: delete-confirm, trigger: open-delete-confirm.click }
  - { from: delete-confirm, to: dashboard, trigger: confirm-delete.submit }
  - { from: delete-confirm, to: dashboard, trigger: cancel-delete.click }
